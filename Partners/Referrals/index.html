<!DOCTYPE html>
<!--
  Title: Mary Kay Partner Referral Landing Page
  Author: Hali Sarah Parsons
  Date: 2026-10-30
  Modified By: Claude
  Description: Landing page for the business partner program. Visitors pick the business that
               referred them (type-ahead from the partner list), then go to the skin assessment.
               The referral rides along and is added to the emails sent to the consultant.
               Partner links: /Partners/Referrals/?ref=CODE pre-fills the business.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Partner Referral | Beauty by Hali Sarah</title>
<!-- WHY noindex: this page is for people arriving from a partner, not for search traffic -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Referred by a local business? Start your free skin assessment with Hali Sarah Parsons.">
<meta name="theme-color" content="#0d0609">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Beauty by Hali Sarah">
<meta property="og:title" content="Free Skin Assessment">
<meta property="og:description" content="Referred by a local business? Start your free, personalized skin assessment with Hali Sarah.">
<meta property="og:url" content="https://beauty.iqproductionz.com/Partners/Referrals/">
<meta property="og:image" content="https://beauty.iqproductionz.com/assets/share/share-assess.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="https://beauty.iqproductionz.com/assets/share/share-assess.jpg">
<script src="/assets/partner/referral.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--pink:#e8507a;--pink-dark:#c93a62;--pink-soft:#f6a9c3;--blush:#fbd3e0;--plum:#3a0f2a;--gold:#c9a96e;--gold-lt:#ead5a8;--ink:#0d0609}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--ink);color:#fff;font-family:Jost,system-ui,sans-serif;overflow-x:hidden}

  /* Same crossfading Career Car backdrop as the splash page so the brand feels continuous */
  .bg{position:fixed;inset:0;overflow:hidden}
  .bg img{position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;object-position:50% 48%;
    opacity:0;filter:saturate(1.1) blur(2px);animation:fade 7.5s ease-in-out infinite, drift 7.5s linear infinite}
  .bg img:nth-child(1){animation-delay:-.75s,-.75s}
  .bg img:nth-child(2){animation-delay:1.75s,1.75s}
  .bg img:nth-child(3){animation-delay:4.25s,4.25s}
  @keyframes fade{0%{opacity:0}10%{opacity:1}40%{opacity:1}48%{opacity:0}100%{opacity:0}}
  @keyframes drift{from{transform:scale(1)}to{transform:scale(1.09)}}
  @media (max-aspect-ratio:3/4){.bg img{filter:saturate(1.1) blur(4px)}}
  .veil{position:fixed;inset:0;background:
    radial-gradient(ellipse at 50% 30%, rgba(13,6,9,.45) 0%, rgba(13,6,9,.78) 72%),
    linear-gradient(180deg, rgba(13,6,9,.45) 0%, rgba(13,6,9,.6) 45%, rgba(58,15,42,.95) 100%)}

  .sparkles{position:fixed;inset:0;pointer-events:none}
  .sparkles i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--gold-lt);
    box-shadow:0 0 8px var(--gold);opacity:0;animation:rise linear infinite}
  .sparkles i:nth-child(even){background:var(--pink-soft);box-shadow:0 0 8px var(--pink)}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-95vh) scale(1.2);opacity:0}}

  /* WHY bottom-weighted: brand on top, the one action the visitor takes sits low where thumbs are */
  main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-end;text-align:center;padding:48px 16px calc(7vh + env(safe-area-inset-bottom))}
  .eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-lt);opacity:0;animation:up 1s .2s ease forwards}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;line-height:.9;font-size:clamp(60px,14vw,130px);
    letter-spacing:.06em;margin:.18em 0 .08em;
    background:linear-gradient(100deg,var(--pink) 0%,var(--pink-soft) 30%,#fff3f7 45%,var(--pink-soft) 60%,var(--pink) 100%);
    background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;animation:up 1.2s .5s ease forwards, sheen 3.2s 1.4s ease-in-out infinite}
  .by{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(18px,3.6vw,24px);color:var(--blush);opacity:0;animation:up 1s .9s ease forwards}
  .rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto;opacity:0;animation:up 1s 1.1s ease forwards}
  .lead{max-width:460px;font-size:14px;line-height:1.7;color:#f3dfe6;font-weight:300;margin-bottom:22px;opacity:0;animation:up 1s 1.3s ease forwards}

  .card{width:min(460px,100%);text-align:left;background:rgba(13,6,9,.45);border:1px solid rgba(201,169,110,.35);
    border-radius:18px;padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;animation:up 1s 1.5s ease forwards}
  label{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-lt);margin-bottom:8px}
  .combo{position:relative}
  .combo input{width:100%;padding:15px 44px 15px 16px;border-radius:12px;border:1.5px solid rgba(246,169,195,.45);
    background:rgba(255,255,255,.96);color:#2a1a20;font-family:Jost,sans-serif;font-size:16px;outline:none;transition:border .2s,box-shadow .2s}
  .combo input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(232,80,122,.22)}
  .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:none;border-radius:50%;
    background:#f3e3e9;color:#8a7a80;font-size:16px;cursor:pointer;display:none}
  .clear.show{display:block}
  /* WHY opens upward: the box sits near the bottom of the screen, so a downward list would fall off-screen */
  .list{position:absolute;left:0;right:0;bottom:calc(100% + 6px);max-height:min(300px,45vh);overflow-y:auto;background:#fff;
    border-radius:12px;box-shadow:0 -10px 34px rgba(0,0,0,.4);display:none;z-index:10}
  .list.open{display:block}
  .opt{padding:11px 14px;cursor:pointer;color:#2a1a20;border-bottom:1px solid #f6eef1;font-size:14px;line-height:1.35}
  .opt:last-child{border-bottom:none}
  .opt small{display:block;color:#8a7a80;font-size:11.5px;margin-top:2px}
  .opt mark{background:none;color:var(--pink-dark);font-weight:600}
  .opt.active,.opt:hover{background:#fff1f5}
  .opt.custom{color:#8a7a80;font-style:italic}
  .picked{margin-top:10px;font-size:12.5px;color:var(--blush);min-height:18px}
  .picked b{color:#fff;font-weight:500}
  .picked .code{color:var(--gold-lt);letter-spacing:.08em}

  .go{display:block;width:100%;margin-top:16px;padding:16px 18px;border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(90deg,var(--pink),var(--pink-dark));color:#fff;font-family:Jost,sans-serif;font-size:13px;
    font-weight:500;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 10px 30px rgba(232,80,122,.4);transition:transform .2s,box-shadow .2s}
  .go:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(232,80,122,.5)}
  .skip{display:inline-block;margin-top:14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-lt);
    opacity:.75;text-decoration:none;width:100%;text-align:center}
  .skip:hover{opacity:1}
  .err{color:#ffb3c7;font-size:12px;margin-top:8px;min-height:16px}
  footer{margin-top:20px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.45)}

  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:0 0}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <img src="/assets/redirect/pink-cadillac.jpg" alt="">
    <img src="/assets/redirect/premier-club.jpg" alt="">
    <img src="/assets/redirect/grand-achiever.jpg" alt="">
  </div>
  <div class="veil" aria-hidden="true"></div>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <main>
    <p class="eyebrow">Partner Referral</p>
    <h1>Beauty</h1>
    <p class="by">with Hali Sarah</p>
    <div class="rule"></div>
    <p class="lead">Welcome! Tell me which local business sent you, then take your free, personalized skin assessment.</p>

    <form class="card" id="form" autocomplete="off" novalidate>
      <label for="biz">I was referred by</label>
      <div class="combo">
        <input id="biz" type="text" placeholder="Start typing the business name…" role="combobox"
               aria-autocomplete="list" aria-expanded="false" aria-controls="biz-list">
        <button type="button" class="clear" id="clear" aria-label="Clear">×</button>
        <div class="list" id="biz-list" role="listbox"></div>
      </div>
      <div class="picked" id="picked" aria-live="polite"></div>
      <div class="err" id="err" aria-live="polite"></div>
      <button class="go" type="submit">Start My Free Assessment →</button>
      <a class="skip" id="skip" href="/Assess/">No referral, continue</a>
    </form>
    <footer>Independent Beauty Consultant · Atascocita, TX</footer>
  </main>

<script>
/** WHY one constant: the assessment path changes in one place if you point partners elsewhere */
const NEXT_URL = '/Assess/';
const DATA_URL = '/Partners/Referrals/partners.json';
const MAX_SHOWN = 8;

const input = document.getElementById('biz');
const list  = document.getElementById('biz-list');
const picked = document.getElementById('picked');
const err = document.getElementById('err');
const clearBtn = document.getElementById('clear');

let partners = null;   // [[name, city, code, address?], ...]
let index = null;      // lowercase names, built once for fast searching
let loading = null;
let matches = [];
let active = -1;
let choice = null;     // {name, city, code} once a business is picked

/** WHY lazy load: the list is ~40k businesses, so it's only fetched when someone starts typing */
function loadPartners(){
  if(partners) return Promise.resolve(partners);
  if(loading) return loading;
  loading = fetch(DATA_URL).then(r => r.json()).then(d => {
    partners = d;
    index = d.map(p => norm(p[0]));
    return d;
  }).catch(() => {
    // WHY: if the list fails to load, people can still type the name and continue
    partners = []; index = [];
    return partners;
  });
  return loading;
}

/** WHY normalize: "Kelly's House of Beauty" should match "kellys house" and extra spaces */
function norm(s){ return String(s).toLowerCase().replace(/[’'`.,&-]/g,'').replace(/\s+/g,' ').trim(); }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/** Highlights the typed text inside the name. WHY: shows people why a result matched */
function highlight(name, q){
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0 || !q) return esc(name);
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+q.length)) + '</mark>' + esc(name.slice(i+q.length));
}

/** Finds matches: names that START with the text first, then names that CONTAIN it.
    WHY two passes: typing "beauty" should list "Beauty Zone" before "Kelly's House Of Beauty" */
function search(q){
  const n = norm(q);
  if(n.length < 2 || !index) return [];
  const starts = [], contains = [];
  for(let i = 0; i < index.length && starts.length < MAX_SHOWN; i++){
    if(index[i].startsWith(n)) starts.push(i);
  }
  if(starts.length < MAX_SHOWN){
    const words = n.split(' ');
    for(let i = 0; i < index.length && starts.length + contains.length < MAX_SHOWN; i++){
      if(index[i].startsWith(n)) continue;
      // WHY every word: "nails katy" finds "Luxury Nails" in Katy when city is part of the search
      const hay = index[i] + ' ' + partners[i][1].toLowerCase();
      if(words.every(w => hay.indexOf(w) > -1)) contains.push(i);
    }
  }
  return starts.concat(contains);
}

function render(q){
  matches = search(q);
  active = -1;
  let html = matches.map((i, k) => {
    const p = partners[i];
    const sub = p[1] + (p[3] ? ' · ' + p[3] : '');
    return '<div class="opt" role="option" id="opt-'+k+'" data-k="'+k+'">' + highlight(p[0], q.trim()) + '<small>' + esc(sub) + '</small></div>';
  }).join('');
  if(q.trim().length >= 2){
    html += '<div class="opt custom" role="option" data-k="custom">Not listed? Use “' + esc(q.trim()) + '”</div>';
  }
  list.innerHTML = html;
  const open = q.trim().length >= 2;
  list.classList.toggle('open', open);
  input.setAttribute('aria-expanded', open);
}

function pick(k){
  if(k === 'custom'){
    choice = { name: input.value.trim(), city: '', code: '' };
  }else{
    const p = partners[matches[k]];
    choice = { name: p[0], city: p[1], code: p[2] };
    input.value = p[0];
  }
  close();
  showPicked();
}

function showPicked(){
  clearBtn.classList.toggle('show', !!input.value);
  if(!choice){ picked.innerHTML = ''; return; }
  picked.innerHTML = 'Referred by <b>' + esc(choice.name) + '</b>'
    + (choice.city ? ' · ' + esc(choice.city) : '')
    + (choice.code ? ' &nbsp;<span class="code">#' + esc(choice.code) + '</span>' : '');
}

function close(){ list.classList.remove('open'); input.setAttribute('aria-expanded','false'); active = -1; }

function move(d){
  const opts = list.querySelectorAll('.opt');
  if(!opts.length) return;
  active = (active + d + opts.length) % opts.length;
  opts.forEach((o,i) => o.classList.toggle('active', i === active));
  opts[active].scrollIntoView({block:'nearest'});
}

input.addEventListener('focus', loadPartners);
input.addEventListener('input', () => {
  choice = null; err.textContent = ''; showPicked();
  // WHY wait for data: first keystrokes may arrive before the list finishes downloading
  loadPartners().then(() => render(input.value));
});
input.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown'){ e.preventDefault(); move(1); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); move(-1); }
  else if(e.key === 'Enter' && list.classList.contains('open') && active > -1){
    e.preventDefault();
    const el = list.querySelectorAll('.opt')[active];
    pick(el.dataset.k === 'custom' ? 'custom' : +el.dataset.k);
  }
  else if(e.key === 'Escape') close();
});
// WHY mousedown: fires before the input loses focus, so the click isn't swallowed by the blur
list.addEventListener('mousedown', e => {
  const el = e.target.closest('.opt'); if(!el) return;
  e.preventDefault();
  pick(el.dataset.k === 'custom' ? 'custom' : +el.dataset.k);
});
input.addEventListener('blur', () => setTimeout(close, 120));
clearBtn.addEventListener('click', () => { input.value = ''; choice = null; showPicked(); input.focus(); });

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const typed = input.value.trim();
  if(!typed){ err.textContent = 'Please type the business that referred you, or tap “No referral”.'; input.focus(); return; }
  // WHY: if they typed a name but never tapped a suggestion, keep exactly what they typed
  if(!choice || choice.name !== typed) choice = { name: typed, city: '', code: '' };
  window.MKReferral.set({ name: choice.name, city: choice.city, code: choice.code, source: 'partner-page', ts: Date.now() });
  // WHY pass the code too: if storage is blocked, /Assess/ can still pick it up from the link
  location.href = NEXT_URL + (choice.code ? '?ref=' + encodeURIComponent(choice.code) : '');
});

/** Partner links (/Partners/Referrals/?ref=CODE) pre-fill the business. WHY: partners can share or print one link */
(function prefill(){
  const code = (new URLSearchParams(location.search).get('ref') || '').trim().toUpperCase();
  if(!code) return;
  loadPartners().then(d => {
    const p = d.find(x => x[2] === code);
    if(!p) return;
    input.value = p[0];
    choice = { name: p[0], city: p[1], code: p[2] };
    showPicked();
  });
})();

/** WHY JS-placed sparkles: positions vary per visit; mirrors the splash page */
(function(){
  const box = document.getElementById('sparkles');
  for(let i = 0; i < 16; i++){
    const s = document.createElement('i');
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (5 + Math.random()*5) + 's';
    s.style.animationDelay = (Math.random()*5) + 's';
    box.appendChild(s);
  }
})();
</script>
</body>
</html>
